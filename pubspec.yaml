name: core_kit
description: "CoreKit (core_kit) — Flutter UI kit with responsive scaling, Dio HTTP, JWT auth, secure storage, and 35+ widgets."
version: 1.1.0-beta.3
homepage: https://github.com/kmmuzahid/flutter_core_kit.git
documentation: https://pub.dev/documentation/core_kit/latest/
repository: https://github.com/kmmuzahid/flutter_core_kit.git

topics:
  - ui
  - widgets
  - networking
  - authentication
  - responsive

screenshots:
  - description: CoreKit feature overview — widgets, networking, and auth in one package
    path: docs_files/corekit_features_unified.png
  - description: Authentication module — OTP, social login, and session management
    path: docs_files/auth.png
  - description: Comments bottom sheet — pre-built social interaction component
    path: docs_files/comment.png
  - description: Tabbed paginated list — infinite scroll with pull-to-refresh
    path: docs_files/tab_list.png

environment:
  sdk: ^3.12.2

platforms:
  android:
  ios:
  macos:
  windows:
  linux:
  web:

dependencies:
  flutter:
    sdk: flutter
  universal_io: ^2.3.1
  intl: ^0.20.3
  flutter_html: ^3.0.0 

  skeletonizer: ^2.1.3
  file_picker: ^11.0.2
  flutter_country_state: ^1.0.2
  flutter_svg: ^2.3.0
  cached_network_image: ^3.4.1
  image_picker: ^1.2.3
  permission_handler: ^12.0.3
  dio: ^5.11.0
  intl_phone_field_v2: ^4.0.5 
 
  share_plus: ^12.0.2
  http: ^1.6.0
  path_provider: ^2.1.6
  http_parser: ^4.1.2
  flutter_reorderable_grid_view: ^5.7.0
  
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5
  android_id: ^0.5.2+1
  uuid: ^4.6.0
  path: ^1.9.1
  material_ui: ^1.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints:
  mockito: ^5.4.4
  build_runner: ^2.4.9
  fake_async: ^1.3.1


flutter:
  uses-material-design: true
  assets:
    - assets/images/
