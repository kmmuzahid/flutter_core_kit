name: core_kit_example
description: Demonstrates the features of the core_kit Flutter package.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  core_kit:
    path: ../

  # Match the version declared in core_kit instead of 'any'
  material_ui: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true